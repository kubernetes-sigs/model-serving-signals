# TokenSpeed and SMG run as child processes in the same engine container.
# One exporter sidecar scrapes all four signals from this image's engine endpoint.
# Create the tokenspeed-profiles ConfigMap as described in README.md first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenspeed
  labels:
    app: tokenspeed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tokenspeed
  template:
    metadata:
      labels:
        app: tokenspeed
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: model-cache
          emptyDir: {}
        - name: profiles
          configMap:
            name: tokenspeed-profiles
      containers:
        - name: tokenspeed
          # Official nightly-621b53 image, pinned to its linux/amd64 manifest.
          image: lightseekorg/tokenspeed@sha256:f9299c4efe88f79c1da9e6d73227fdbbb38d1fa25e1ffab49b3e59eeeb9ee46a
          command: ["tokenspeed", "serve"]
          args:
            - Qwen/Qwen3-0.6B
            - --served-model-name=mss-qwen3
            - --host=0.0.0.0
            - --port=8000
            - --enable-metrics
            - --metrics-host=127.0.0.1
            - --metrics-port=8001
            - --prometheus-host=127.0.0.1
            - --prometheus-port=8002
            - --tensor-parallel-size=1
            - --world-size=1
            - --dtype=bfloat16
            - --max-model-len=1024
            - --max-num-seqs=1
            - --gpu-memory-utilization=0.4
            - --attention-backend=triton
            - --sampling-backend=triton
            - --enforce-eager
            - --disable-prefill-graph
          env:
            - name: HF_HOME
              value: /model-cache
          ports:
            - name: inference
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: inference
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: inference
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /model-cache
        - name: metrics-exporter
          image: us-central1-docker.pkg.dev/k8s-staging-images/model-serving-signals/metrics-exporter:main
          args:
            - --profile=/profiles/tokenspeed.yaml
            - --engine-host=127.0.0.1
            - --engine-metrics-port=8001
            - --exporter-metrics-port=9464
          ports:
            - name: contract
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /healthz
              port: contract
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: profiles
              mountPath: /profiles
              readOnly: true
