# End-to-end test workload: a CPU-only vLLM simulator and the metrics exporter
# running as two containers in the same pod, exactly as deployed in production.
# The exporter scrapes the simulator over localhost and re-emits the mapped
# contract metrics. The profile is baked into the exporter image at /catalog.
apiVersion: v1
kind: Pod
metadata:
  name: mss-e2e
  labels:
    app: mss-e2e
spec:
  restartPolicy: Never
  containers:
    - name: engine
      # CPU-only vLLM simulator: fakes inference and emits vLLM-native metrics.
      image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
      args:
        - "--model=Qwen/Qwen2-0.5B"
        - "--port=8000"
        # Add latency so a request stays in-flight long enough for the test to
        # observe non-zero num_requests_running while it scrapes.
        - "--time-to-first-token=2s"
        - "--inter-token-latency=200ms"
      ports:
        - name: engine
          containerPort: 8000
      readinessProbe:
        httpGet:
          path: /metrics
          port: 8000
        initialDelaySeconds: 2
        periodSeconds: 2
    - name: exporter
      # Built locally by `make image-load` and loaded into the kind cluster.
      image: model-serving-signals/exporter:dev
      imagePullPolicy: Never
      args:
        - "--profile=/catalog/profiles/vllm.yaml"
        - "--engine-host=localhost"
        - "--engine-metrics-port=8000"
        - "--exporter-metrics-port=9464"
      ports:
        - name: contract
          containerPort: 9464
      readinessProbe:
        httpGet:
          path: /metrics
          port: 9464
        initialDelaySeconds: 2
        periodSeconds: 2
