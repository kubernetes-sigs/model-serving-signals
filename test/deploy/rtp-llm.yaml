# Supply images built with the required RTP-LLM revision and this exporter PR.
# Create the rtp-llm-profile ConfigMap using the guide first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtp-llm
spec:
  replicas: 1
  # Release the single GPU and model volume before starting a replacement Pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rtp-llm
  template:
    metadata:
      labels:
        app: rtp-llm
    spec:
      containers:
        - name: engine
          image: ${RTP_LLM_IMAGE}
          command: [python3, -m, rtp_llm.start_server]
          args:
            - --checkpoint_path=/models/Qwen3-0.6B
            - --model_type=qwen_3
            - --frontend_server_count=1
            - --start_port=30000
            - --max_seq_len=2048
            - --kv_cache_mem_mb=2048
          ports:
            - name: inference
              containerPort: 30000
          startupProbe:
            httpGet:
              path: /health
              port: inference
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: inference
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              nvidia.com/gpu: "1"
              memory: 24Gi
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
        - name: exporter
          image: ${EXPORTER_IMAGE}
          args:
            - --profile=/config/rtp-llm.yaml
            - --engine-host=127.0.0.1
            - --engine-metrics-port=30000
            - --engine-metrics-path=/worker_status
          ports:
            - name: contract
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /healthz
              port: contract
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: profile
              mountPath: /config
              readOnly: true
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: rtp-llm-model
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: profile
          configMap:
            name: rtp-llm-profile
