# Engine profile for TensorRT-LLM
# Native names verified against TensorRT-LLM source tensorrt_llm/metrics/collector.py
#
name: trt-llm
signals:
  gen_ai.server.request.duration: trtllm_e2e_request_latency_seconds # histogram, seconds
  gen_ai.server.time_to_first_token: trtllm_time_to_first_token_seconds # histogram, seconds
  gen_ai.server.time_per_output_token: trtllm_time_per_output_token_seconds # histogram, seconds
  gen_ai.server.request.queued: trtllm_num_requests_waiting # gauge
  gen_ai.server.request.running: trtllm_num_requests_running # gauge
