# Engine profile for TokenSpeed
# Native names verified against TokenSpeed commit 985e4ac3bbb0347513f67168b0820e0d3f347db1:
# python/tokenspeed/runtime/metrics/collector.py
# tokenspeed-engine/crates/ts-control/src/event_loop.rs
#
# Enable --enable-metrics and scrape the engine's --metrics-port, not the
# gateway's API or Prometheus port. Latency histograms belong to the frontend
# and are not provided by this engine profile.
# num_requests_running includes queued requests in this version, so it does not
# provide the contract's request.running signal.
name: tokenspeed
signals:
  gen_ai.server.request.queued: tokenspeed:num_requests_waiting # gauge
