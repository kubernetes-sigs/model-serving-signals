# Engine profile for TokenSpeed. The official nightly-621b53 image exposes
# RequestMetrics and EngineMetrics on the same --metrics-port endpoint.
# Native definitions: python/tokenspeed/runtime/metrics/collector.py at 621b53.
#
# 0.1.1.post20261102 removed RequestMetrics; on that version this profile
# emits the queue gauge only. Use tokenspeed-smg.yaml separately for latency
# with SMG 1.13.0.post20261027.
# request_time_per_output_token_seconds includes queueing and TTFT; the decode
# histogram below measures time per output token after the first token.
# num_requests_running includes queued requests in this version, so it does not
# provide the contract's request.running signal.
name: tokenspeed
signals:
  gen_ai.server.request.duration: tokenspeed:e2e_request_latency_seconds # histogram, seconds
  gen_ai.server.time_to_first_token: tokenspeed:time_to_first_token_seconds # histogram, seconds
  gen_ai.server.time_per_output_token: tokenspeed:decode_time_per_output_token_seconds # histogram, seconds
  gen_ai.server.request.queued: tokenspeed:num_requests_waiting # gauge
