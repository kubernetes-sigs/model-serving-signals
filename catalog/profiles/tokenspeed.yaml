# TokenSpeed nightly-621b53, engine --metrics-port.
# TPOT excludes queueing/TTFT.
name: tokenspeed
signals:
  gen_ai.server.request.duration: tokenspeed:e2e_request_latency_seconds # histogram, seconds
  gen_ai.server.time_to_first_token: tokenspeed:time_to_first_token_seconds # histogram, seconds
  gen_ai.server.time_per_output_token: tokenspeed:decode_time_per_output_token_seconds # histogram, seconds
  gen_ai.server.request.queued: tokenspeed:num_requests_waiting # gauge
